<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main>
    <!-- Dark Mode Toggle -->
    <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">
      <span class="theme-icon">🌙</span>
    </button>

    <section id="timerScreen">
      <div id="timer-container">
        <h4 id="author">by Azura Studio</h4>
        <p id="text">I wish this countdown help you</p>
        
        <!-- Input fields for customization -->
        <div id="inputContainer" class="input-group">
          <input type="number" id="minutesInput" min="0" max="59" placeholder="Minutes" value="1">
          <span>:</span>
          <input type="number" id="secondsInput" min="0" max="59" placeholder="Seconds" value="30">
        </div>
        
        <div id="timerDisplay">
          <h1 id="time">01:30</h1>
        </div>
        
        <div id="button-container">
          <button id="startBtn" class="button">Start</button>
          <button id="resetBtn" class="button">Reset</button>
          <button id="closeBtn" class="button">&times;</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
